<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zihan Miao — Portfolio</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --border-color: #30363d;
            --hover-overlay: rgba(177, 186, 196, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 极淡的工程网格背景 */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(48, 54, 61, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(48, 54, 61, 0.3) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.4;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--border-color);
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        @media (max-width: 480px) {
            .avatar {
                max-height: 220px;
            }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }

        .tagline {
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 2rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--border-color);
            margin: 0 0 2rem 0;
        }

        /* 主按钮区 */
        .action-links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-primary {
            background: var(--accent-green);
            color: #fff;
            border: 1px solid rgba(240, 246, 252, 0.1);
        }

        .btn-primary:hover {
            background: var(--accent-green-hover);
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.25);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
            border-color: #484f58;
            transform: translateY(-1px);
        }

        /* 联系信息区 (纯文本 + 图标 + 点击复制) */
        .contact-info {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: all 0.2s;
            position: relative;
        }

        .info-item svg.icon-main {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: var(--text-secondary);
        }

        .info-item.copyable {
            cursor: pointer;
        }

        .info-item.copyable:hover {
            background: var(--hover-overlay);
            color: var(--text-primary);
        }

        .info-item.copyable:hover svg.icon-main {
            color: var(--text-primary);
        }

        .copy-hint {
            position: absolute;
            right: 1rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.2s;
            color: var(--accent-blue);
        }

        .info-item.copyable:hover .copy-hint {
            opacity: 1;
            transform: translateX(0);
        }

        .copy-hint svg {
            width: 12px;
            height: 12px;
        }

        /* Toast 弹窗通知 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--text-primary);
            color: var(--bg-color);
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast svg {
            width: 14px;
            height: 14px;
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toast-text">Copied to clipboard</span>
    </div>

    <div class="container">
        <img src="ZihanMiao1.png" alt="Zihan Miao" class="avatar" id="profile-img" onerror="this.src='https://avatars.githubusercontent.com/u/ZihanMiao-3'">

        <h1>Zihan Miao</h1>
        <p class="subtitle">Integrated Master's in Mechanical &amp; Manufacturing Engineering</p>

        <p class="tagline">
            SolidWorks CAD · CFD/FEA · Microfluidics
        </p>

        <!-- 动作按钮区 -->
        <div class="action-links">
            <a href="https://615783.xyz" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                View Full Portfolio
            </a>

            <a href="https://www.linkedin.com/in/zihan-miao-a2a9b6345" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                LinkedIn Profile
            </a>
        </div>

        <div class="divider"></div>

        <!-- 联系信息区 (Feather Icons) -->
        <div class="contact-info">
            <!-- 地址 (纯展示，无交互) -->
            <div class="info-item">
                <svg class="icon-main" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                Mulhuddart, Dublin 15
            </div>

            <!-- 电话 (点击复制) -->
            <div class="info-item copyable" onclick="copyToClipboard('+353 00 000 0000', 'Phone number copied')">
                <svg class="icon-main" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                <span>+353 00 000 0000</span>
                <div class="copy-hint">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy
                </div>
            </div>

            <!-- 邮箱 (点击复制) -->
            <div class="info-item copyable" onclick="copyToClipboard('zihan.miao3@mail.dcu.ie', 'Email address copied')">
                <svg class="icon-main" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <span>zihan.miao3@mail.dcu.ie</span>
                <div class="copy-hint">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy
                </div>
            </div>
        </div>
    </div>

    <!-- 交互逻辑 -->
    <script>
        let toastTimeout;

        function copyToClipboard(text, successMessage) {
            // 使用现代的 Clipboard API
            navigator.clipboard.writeText(text).then(() => {
                showToast(successMessage);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                // Fallback 用于不支持的旧浏览器
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast(successMessage);
                } catch (err) {
                    console.error('Fallback copy failed', err);
                }
                document.body.removeChild(textArea);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');

            // 清除之前的定时器，防止连续点击导致动画错乱
            clearTimeout(toastTimeout);

            // 设置文字并显示
            toastText.textContent = message;
            toast.classList.add('show');

            // 2.5秒后自动隐藏
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
